name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  source:
    name: Sources and Application Tool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Check generated sources
        run: mise run sync:check

      - name: Check generated CLI reference
        run: mise run docs:reference:check

      - name: Test template tool
        run: uv run --project tools/template-tool pytest tools/template-tool/tests -v

  common:
    name: Common Template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Check template
        run: mise run check common

  python:
    name: Python Template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      # mise resolves `python = "3"` through python-build, which mise clones
      # on first use. Concurrent resolution inside `mise run check python` races
      # on that clone (mise 2026.10.0), so populate it serially first.
      - name: Warm python-build cache
        run: mise ls-remote python > /dev/null

      - name: Check template
        run: mise run check python

  go-cli:
    name: Go CLI Template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Check template
        run: mise run check go-cli

  rust:
    name: Rust Template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Check template
        run: mise run check rust

  node-project:
    name: Node Project Template
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Check template
        run: mise run check node-project
