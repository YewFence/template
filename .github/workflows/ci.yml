name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  source:
    name: Sources and Application Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Check generated sources
        run: mise run sync:check

      - name: Test template tool
        run: uv run --project tools/template-tool python -m unittest discover -s tools/template-tool/tests -v

  common:
    name: Common Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - name: Install template tools
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}
          MISE_GLOBAL_CONFIG_FILE: /dev/null
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/templates/common
        run: mise -C templates/common install --locked

      - name: Check template
        run: mise run check common

  go-cli:
    name: Go CLI Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: monorepo-go-${{ runner.os }}-${{ hashFiles('templates/go-cli/go.sum') }}
          restore-keys: |
            monorepo-go-${{ runner.os }}-

      - name: Install template tools
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}
          MISE_GLOBAL_CONFIG_FILE: /dev/null
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/templates/go-cli
        run: mise -C templates/go-cli install --locked

      - name: Check template
        run: mise run check go-cli

  rust:
    name: Rust Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          cache_key: "mise-monorepo-{{file_hash}}"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: templates/rust
          shared-key: monorepo-rust

      - name: Install template tools
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}
          MISE_GLOBAL_CONFIG_FILE: /dev/null
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/templates/rust
        run: mise -C templates/rust install --locked

      - name: Check template
        run: mise run check rust
