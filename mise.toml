[settings]
lockfile = true

[tools]
pinact = "4"
python = "3"
uv = "0"

[env]
PINACT_MIN_AGE = "3"
PINACT_GITHUB_TOKEN = { value = "${MISE_GITHUB_TOKEN:-}", redact = true }

[tasks.render]
description = "Render one template or all templates"
usage = '''
arg "[template]" help="Template to render; defaults to all" {
  choices "common" "go-cli" "rust"
}
'''
run = '''
uv run --project tools/template-tool render-template{% if usage.template %} "{{ usage.template }}"{% endif %} --root .
'''

[tasks."sync:check"]
description = "Check one generated template or all generated templates"
usage = '''
arg "[template]" help="Template to check; defaults to all" {
  choices "common" "go-cli" "rust"
}
'''
run = '''
uv run --project tools/template-tool render-template --check{% if usage.template %} "{{ usage.template }}"{% endif %} --root .
'''

[tasks.check]
description = "Run one template's checks or all template checks"
usage = '''
arg "[template]" help="Template to check; defaults to all" {
  choices "common" "go-cli" "rust"
}
'''
run = '''
uv run --project tools/template-tool check-templates{% if usage.template %} "{{ usage.template }}"{% endif %} --root .
'''

[tasks."actions:update"]
description = "Update and pin root maintenance workflow actions"
run = "pinact run --update .github/workflows"

[tasks."docs:reference"]
description = "Generate the CLI reference markdown"
run = "uv run --project tools/template-tool generate-cli-reference docs/reference/cli.md"

[tasks."docs:reference:check"]
description = "Check the generated CLI reference is in sync"
run = "uv run --project tools/template-tool generate-cli-reference --check docs/reference/cli.md"
