version = 2

[apply]
protected = [
  ".gitignore",
  "AGENTS.md",
  "AGENTS.*",
  "LICENSE*",
  "LICENCE*",
  "COPYING*",
  "NOTICE*",
]
hints = [
  "Protected project identity and workspace-control files are intentionally left unchanged; compare them with the selected template manually when needed.",
]

[templates.common]
 [templates.common.capabilities]
 docs-site = true
 codecov-upload = false
 [templates.common.instantiation]
 required = ["project_name", "description", "github_owner", "repo_name"]
 [templates.common.instantiation.tokens]
 PROJECT_NAME = "project_name"
 PROJECT_DESCRIPTION = "description"
 GITHUB_OWNER = "github_owner"
 REPO_NAME = "repo_name"
 [templates.common.instantiation.derived.PROJECT_DESCRIPTION_JSON]
 source = "description"
 transform = "json-string"
 [templates.common.instantiation.derived.PROJECT_NAME_JSON]
 source = "project_name"
 transform = "json-string"
 [templates.common.instantiation.validation.metadata]
 project_name = "Example Project"
 description = "Example project description"
 github_owner = "YewFence"
 repo_name = "example-project"
 [templates.common.instantiation.export.metadata]
 project_name = "REPLACE ME: project name"
 description = "REPLACE ME: project description"
 github_owner = "replace-me-owner"
 repo_name = "replace-me-repository"
 [templates.common.slots."mise.ci.toml"]
 audit_tasks = ["shared:mise/ci/common-audit.toml.j2"]
 coverage_tools = { capability = "codecov-upload", fragments = ["shared:mise/ci/codecov-tools.toml.j2"] }
 release_package = ["shared:mise/ci/common-package.toml.j2"]
 [templates.common.slots."mise.toml"]
 docs_tools = { capability = "docs-site", fragments = ["shared:mise/docs-tools.toml.j2"] }
 docs_tasks = { capability = "docs-site", fragments = ["shared:mise/docs-tasks.toml.j2"] }
 coverage_task = { capability = "codecov-upload", fragments = ["overlay:mise/coverage.toml.j2"] }
 [templates.common.slots."README.md"]
 docs_badge = { capability = "docs-site", fragments = ["shared:docs/README.md.j2"] }
 docs_section = { capability = "docs-site", fragments = ["shared:docs/README-section.md.j2"] }
 [templates.common.slots."CONTRIBUTING.md"]
 project_principles = ["overlay:contributing/project-principles.md.j2"]
 audit_command = ["overlay:contributing/audit-command.md.j2"]
 docs_section = { capability = "docs-site", fragments = ["shared:docs/CONTRIBUTING-section.md.j2"] }
 [templates.common.slots.".gitignore"]
 docs_ignored_paths = { capability = "docs-site", fragments = ["shared:docs-ignored-paths.j2"] }
 coverage_ignored_paths = { capability = "codecov-upload", fragments = ["overlay:gitignore/coverage.j2"] }
 [templates.common.slots.".github/workflows/ci.yml"]
 docs_job = { capability = "docs-site", fragments = ["shared:workflows/docs/docs-job.yml.j2"] }
 coverage_job = { capability = "codecov-upload", fragments = ["shared:workflows/coverage/pr-prefix.yml.j2", "overlay:workflows/ci/coverage-job.yml.j2", "shared:workflows/coverage/pr-suffix.yml.j2"] }
 [templates.common.capability_outputs]
 docs-site = ["docs/", ".github/workflows/docs.yml"]
 codecov-upload = [".github/workflows/coverage.yml"]
 [templates.common.slots.".github/workflows/coverage.yml"]
 coverage_job = { capability = "codecov-upload", fragments = ["shared:workflows/coverage/default-prefix.yml.j2", "overlay:workflows/ci/coverage-job.yml.j2", "shared:workflows/coverage/default-suffix.yml.j2"] }
 [templates.common.slots.".github/workflows/audit.yml"]
 audit_paths = ["shared:workflows/audit/common-paths.yml.j2"]
 [templates.common.slots.".github/workflows/prepare-release.yml"]
 release_install_args = ["shared:workflows/prepare-release/install-args.j2"]
 release_files = ["shared:workflows/prepare-release/files.j2"]
 [templates.common.slots.".github/workflows/release.yml"]
 release_needs = ["shared:workflows/release/version-only.j2"]

