[package]
name = "{{CARGO_PACKAGE}}"
version = "0.1.0"
description = {{PROJECT_DESCRIPTION_TOML}}
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/{{GITHUB_OWNER}}/{{REPO_NAME}}"
readme = "README.md"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
