[tasks."locks:update"]
description = "Update generated dependency state for a staging template"
usage = '''
flag "--bump" help="Re-resolve fuzzy mise tool versions"
arg "<template_root>" help="Staging template root"
'''
run = '''
mise -C "{{ usage.template_root }}" -E ci lock{% if usage.bump %} --bump{% endif %}
mise -C "{{ usage.template_root }}/docs" exec -- pnpm install --lockfile-only
'''
