[tasks.check]
description = "Validate an unbootstrapped common template in disposable staging"
usage = '''
arg "<template_root>" help="Staging template root"
'''
run = '''
enabled_capabilities="${TEMPLATE_TOOL_ENABLED_CAPABILITIES:?TEMPLATE_TOOL_ENABLED_CAPABILITIES is required}"
case "${enabled_capabilities}" in
  '[]')
    docs_site_enabled=false
    codecov_upload_enabled=false
    ;;
  '["codecov-upload"]')
    docs_site_enabled=false
    codecov_upload_enabled=true
    ;;
  '["docs-site"]')
    docs_site_enabled=true
    codecov_upload_enabled=false
    ;;
  '["codecov-upload","docs-site"]')
    docs_site_enabled=true
    codecov_upload_enabled=true
    ;;
  *)
    echo "unexpected common capability set: ${enabled_capabilities}" >&2
    exit 1
    ;;
esac

template_root="{{ usage.template_root }}"
if git -C "${template_root}" grep -nE '(README\.template\.md|AGENTS\.template\.md)' -- .; then
  echo "legacy common template identity files remain in staging" >&2
  exit 1
fi

task_names="$(mise -C "${template_root}" tasks ls --local --name-only)"
if ${docs_site_enabled}; then
  for task in docs:install docs:lock docs:install:locked docs:dev docs:build docs:preview; do
    if ! printf '%s\n' "${task_names}" | grep -Fxq "${task}"; then
      echo "docs-site enabled but mise task is missing: ${task}" >&2
      exit 1
    fi
  done
  for tool in node pnpm; do
    if ! grep -Eq "^${tool}[[:space:]]*=" "${template_root}/mise.toml"; then
      echo "docs-site enabled but mise tool is missing: ${tool}" >&2
      exit 1
    fi
  done
  if [[ ! -d "${template_root}/docs" || ! -f "${template_root}/docs/package.json" || ! -f "${template_root}/.github/workflows/docs.yml" ]]; then
    echo "docs-site enabled but complete outputs are missing" >&2
    exit 1
  fi
  if ! grep -Eq '^  docs:$' "${template_root}/.github/workflows/ci.yml" ||
     ! grep -Fq 'run: mise run docs:build' "${template_root}/.github/workflows/ci.yml"; then
    echo "docs-site enabled but CI docs job is missing" >&2
    exit 1
  fi
else
  if printf '%s\n' "${task_names}" | grep -Eq '^docs:'; then
    echo "docs-site disabled but mise docs tasks remain" >&2
    exit 1
  fi
  for tool in node pnpm; do
    if grep -Eq "^${tool}[[:space:]]*=" "${template_root}/mise.toml"; then
      echo "docs-site disabled but mise tool remains: ${tool}" >&2
      exit 1
    fi
  done
  if [[ -e "${template_root}/docs" || -e "${template_root}/.github/workflows/docs.yml" ]]; then
    echo "docs-site disabled but complete outputs remain" >&2
    exit 1
  fi
  if grep -Eq '^  docs:$' "${template_root}/.github/workflows/ci.yml" ||
     grep -Fq 'run: mise run docs:build' "${template_root}/.github/workflows/ci.yml"; then
    echo "docs-site disabled but CI docs job remains" >&2
    exit 1
  fi
fi

coverage_report="coverage.xml"
coverage_workflow="${template_root}/.github/workflows/ci.yml"
default_coverage_workflow="${template_root}/.github/workflows/coverage.yml"
if ${codecov_upload_enabled}; then
  if ! printf '%s\n' "${task_names}" | grep -Fxq coverage; then
    echo "codecov-upload enabled but mise coverage task is missing" >&2
    exit 1
  fi
  if ! grep -Fq '[tasks.coverage]' "${template_root}/mise.toml" ||
     ! grep -Fq 'generates coverage.xml in the repository root' "${template_root}/mise.toml" ||
     ! grep -Fq 'exit 1' "${template_root}/mise.toml"; then
    echo "codecov-upload enabled but common coverage placeholder contract is incomplete" >&2
    exit 1
  fi
  coverage_job="$(sed -n '/^  coverage:$/,/^  [[:alnum:]_-]\+:$/p' "${coverage_workflow}")"
  for required in \
    'run: mise run coverage' \
    'contents: read' \
    'uses: codecov/codecov-action@v7' \
    'binary: ${{ steps.codecov-cli.outputs.path }}' \
    'files: ${{ steps.coverage.outputs.report }}' \
    'disable_search: true' \
    'fail_ci_if_error: true' \
    'github.event_name ==' \
    'id: codecov-cli' \
    'GITHUB_STEP_SUMMARY'; do
    if ! printf '%s\n' "${coverage_job}" | grep -Fq "${required}"; then
      echo "codecov-upload enabled but coverage job is missing: ${required}" >&2
      exit 1
    fi
  done
  if printf '%s\n' "${coverage_job}" | grep -Eq 'id-token: write|contents: write|packages: write|pull-requests: write|CODECOV_TOKEN|pull_request_target|use_oidc|override_branch|override_pr|skip_validation'; then
    echo "codecov-upload coverage job requests unsafe permissions or authentication" >&2
    exit 1
  fi
  if ! grep -Fq '"pipx:codecov-cli" = "11"' "${template_root}/mise.ci.toml" ||
     grep -Fq 'pipx:codecov-cli' "${template_root}/mise.toml"; then
    echo "codecov-upload common CLI tool ownership is incorrect" >&2
    exit 1
  fi
  if [[ ! -f "${default_coverage_workflow}" ]]; then
    echo "codecov-upload default branch workflow is missing" >&2
    exit 1
  fi
  default_job="$(sed -n '/^  coverage:$/,$p' "${default_coverage_workflow}")"
  for required in \
    'github.event_name == '\
    'refs/heads/main' \
    'id-token: write' \
    'use_oidc: true' \
    'binary: ${{ steps.codecov-cli.outputs.path }}' \
    'files: ${{ steps.coverage.outputs.report }}' \
    'group: coverage-${{ github.ref }}' \
    'cancel-in-progress: true'; do
    if ! grep -Fq "${required}" "${default_coverage_workflow}"; then
      echo "codecov-upload default branch workflow is missing: ${required}" >&2
      exit 1
    fi
  done
  if grep -Eq 'pull_request|CODECOV_TOKEN|pull_request_target|override_branch|override_pr|skip_validation' "${default_coverage_workflow}"; then
    echo "codecov-upload default branch workflow has unsafe or PR-only behavior" >&2
    exit 1
  fi
  if ! grep -Fxq "/${coverage_report}" "${template_root}/.gitignore"; then
    echo "codecov-upload enabled but coverage report is not ignored: ${coverage_report}" >&2
    exit 1
  fi
  if grep -Eq 'cargo-llvm-cov|golang.org/.*/cover' "${template_root}/mise.ci.toml"; then
    echo "common codecov-upload must not install a language coverage tool" >&2
    exit 1
  fi
else
  if printf '%s\n' "${task_names}" | grep -Fxq coverage ||
     grep -Eq 'codecov|id-token: write|mise run coverage' "${coverage_workflow}" ||
     [[ -e "${default_coverage_workflow}" ]] ||
     grep -Fq 'pipx:codecov-cli' "${template_root}/mise.ci.toml" ||
     grep -Fxq "/${coverage_report}" "${template_root}/.gitignore"; then
    echo "codecov-upload disabled but coverage behavior remains" >&2
    exit 1
  fi
fi

unset MISE_LOCKED
mise -C "${template_root}" -E ci lock
export MISE_LOCKED=1
mise -C "${template_root}" install --locked
mise -C "${template_root}" run deps:update
if ${docs_site_enabled}; then
  mise -C "${template_root}" run docs:lock
  mise -C "${template_root}" run docs:build
fi
mise -C "${template_root}" run actions:update
git -C "${template_root}" add --all
mise -C "${template_root}" run check
'''
