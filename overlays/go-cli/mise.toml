[tasks.check]
description = "Validate an unbootstrapped Go CLI template in disposable staging"
usage = '''
arg "<template_root>" help="Staging template root"
'''
run = '''
repository_root="${TEMPLATE_TOOL_REPOSITORY_ROOT:-$(git rev-parse --show-toplevel)}"
uv run --project "${repository_root}/tools/template-tool" python "${repository_root}/overlays/go-cli/validation/check.py" "{{ usage.template_root }}"
'''
