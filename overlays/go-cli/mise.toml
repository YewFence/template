[tasks.check]
description = "Validate an unbootstrapped Go CLI template in disposable staging"
usage = '''
arg "<template_root>" help="Staging template root"
'''
run = '''
enabled_capabilities="${TEMPLATE_TOOL_ENABLED_CAPABILITIES:?TEMPLATE_TOOL_ENABLED_CAPABILITIES is required}"
case "${enabled_capabilities}" in
  '[]')
    docs_site_enabled=false
    container_image_publish_enabled=false
    ;;
  '["docs-site"]')
    docs_site_enabled=true
    container_image_publish_enabled=false
    ;;
  '["container-image-publish"]')
    docs_site_enabled=false
    container_image_publish_enabled=true
    ;;
  '["container-image-publish","docs-site"]')
    docs_site_enabled=true
    container_image_publish_enabled=true
    ;;
  *)
    echo "unexpected Go CLI capability set: ${enabled_capabilities}" >&2
    exit 1
    ;;
esac

template_root="{{ usage.template_root }}"
if git -C "${template_root}" grep -nE '(your-cli|github\.com/example/your-cli|README\.template\.md|AGENTS\.template\.md|tools/(init-template|apply-existing))' -- .; then
  echo "legacy Go CLI identity remains in staging" >&2
  exit 1
fi

task_names="$(mise -C "${template_root}" tasks ls --local --name-only)"
ci_task_names="$(mise -C "${template_root}" -E ci tasks ls --local --name-only)"
if ${docs_site_enabled}; then
  for task in docs:install docs:lock docs:install:locked docs:dev docs:build docs:preview; do
    if ! printf '%s\n' "${task_names}" | grep -Fxq "${task}"; then
      echo "docs-site enabled but mise task is missing: ${task}" >&2
      exit 1
    fi
  done
  for tool in node pnpm; do
    if ! grep -Eq "^${tool}[[:space:]]*=" "${template_root}/mise.toml"; then
      echo "docs-site enabled but mise tool is missing: ${tool}" >&2
      exit 1
    fi
  done
  if [[ ! -d "${template_root}/docs" || ! -f "${template_root}/docs/package.json" || ! -f "${template_root}/.github/workflows/docs.yml" ]]; then
    echo "docs-site enabled but complete outputs are missing" >&2
    exit 1
  fi
  if ! grep -Eq '^  docs:$' "${template_root}/.github/workflows/ci.yml" ||
     ! grep -Fq 'run: mise run docs:build' "${template_root}/.github/workflows/ci.yml"; then
    echo "docs-site enabled but CI docs job is missing" >&2
    exit 1
  fi
else
  if printf '%s\n' "${task_names}" | grep -Eq '^docs:'; then
    echo "docs-site disabled but mise docs tasks remain" >&2
    exit 1
  fi
  for tool in node pnpm; do
    if grep -Eq "^${tool}[[:space:]]*=" "${template_root}/mise.toml"; then
      echo "docs-site disabled but mise tool remains: ${tool}" >&2
      exit 1
    fi
  done
  if [[ -e "${template_root}/docs" || -e "${template_root}/.github/workflows/docs.yml" ]]; then
    echo "docs-site disabled but complete outputs remain" >&2
    exit 1
  fi
  if grep -Eq '^  docs:$' "${template_root}/.github/workflows/ci.yml" ||
     grep -Fq 'run: mise run docs:build' "${template_root}/.github/workflows/ci.yml"; then
    echo "docs-site disabled but CI docs job remains" >&2
    exit 1
  fi
fi

if ${container_image_publish_enabled}; then
  for task in container:build container:publish; do
    if ! printf '%s\n' "${ci_task_names}" | grep -Fxq "${task}"; then
      echo "container-image-publish enabled but mise task is missing: ${task}" >&2
      exit 1
    fi
  done
  if ! grep -Eq '^"aqua:ko-build/ko"[[:space:]]*=[[:space:]]*"0\.19"$' "${template_root}/mise.ci.toml"; then
    echo "container-image-publish enabled but ko tool is missing" >&2
    exit 1
  fi
  if ! grep -Fq './cmd/example-go-cli' "${template_root}/mise.ci.toml" ||
     ! grep -Fq -- 'ko build --local --tags dev' "${template_root}/mise.ci.toml" ||
     ! grep -Fq -- '--platform=all' "${template_root}/mise.ci.toml" ||
     ! grep -Fq -- '--bare' "${template_root}/mise.ci.toml"; then
    echo "container-image-publish enabled but ko task contract is incomplete" >&2
    exit 1
  fi
  release_workflow="${template_root}/.github/workflows/release.yml"
  if ! grep -Fq '  publish-container:' "${release_workflow}" ||
     ! grep -Fq 'needs: [version, release]' "${release_workflow}" ||
     ! grep -Fq 'packages: write' "${release_workflow}" ||
     ! grep -Fq 'ko login ghcr.io' "${release_workflow}" ||
     ! grep -Fq 'CONTAINER_IMAGE_REPOSITORY: ghcr.io/YewFence/example-go-cli' "${release_workflow}" ||
     ! grep -Fq 'RELEASE_PRERELEASE: ${{ needs.version.outputs.prerelease }}' "${release_workflow}" ||
     ! grep -Fq 'run: mise run container:publish' "${release_workflow}"; then
    echo "container-image-publish enabled but release workflow contract is incomplete" >&2
    exit 1
  fi
  if grep -Fq 'ko build' "${release_workflow}"; then
    echo "container-image-publish workflow duplicates the ko build command" >&2
    exit 1
  fi
  if ! grep -Fq 'tag_args+=(--tags latest)' "${template_root}/mise.ci.toml" ||
     ! grep -Fq 'RELEASE_PRERELEASE must be true or false' "${template_root}/mise.ci.toml"; then
    echo "container-image-publish enabled but stable and prerelease tag branches are missing" >&2
    exit 1
  fi
else
  for task in container:build container:publish; do
    if printf '%s\n' "${ci_task_names}" | grep -Fxq "${task}"; then
      echo "container-image-publish disabled but mise task remains: ${task}" >&2
      exit 1
    fi
  done
  if grep -Eq '^"aqua:ko-build/ko"[[:space:]]*=' "${template_root}/mise.ci.toml"; then
    echo "container-image-publish disabled but ko tool remains" >&2
    exit 1
  fi
  if grep -Eq 'publish-container|ko login ghcr\.io|packages: write|CONTAINER_IMAGE_REPOSITORY: ghcr\.io/' "${template_root}/.github/workflows/release.yml"; then
    echo "container-image-publish disabled but release workflow behavior remains" >&2
    exit 1
  fi
fi

for unexpected_output in Dockerfile ko.yaml .ko.yaml; do
  if [[ -e "${template_root}/${unexpected_output}" ]]; then
    echo "container-image-publish must not generate ${unexpected_output}" >&2
    exit 1
  fi
done

unset MISE_LOCKED
mise -C "${template_root}" -E ci lock
export MISE_LOCKED=1
mise -C "${template_root}" install --locked
mise -C "${template_root}" run deps:update
if ${container_image_publish_enabled}; then
  mise -C "${template_root}" -E ci run container:build
fi
if ${docs_site_enabled}; then
  mise -C "${template_root}" run docs:lock
  mise -C "${template_root}" run docs:build
fi
mise -C "${template_root}" run actions:update
git -C "${template_root}" add --all
mise -C "${template_root}" run check
'''
